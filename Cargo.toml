###########################################################
# Dependencies
[workspace.dependencies]
tokio = { version = "1.50.0" }
anyhow = { version = "1.0.102" }
bitflags = { version = "2.11.0" }
bon = { version = "3.9.0" }
bytemuck = { version = "1.25.0" }
bytes = { version = "1.11.1" }
clap = { version = "4.5.60" }
flume = { version = "0.12.0" }
pollster = { version = "0.4.0" }
