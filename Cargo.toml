[workspace]
resolver = "2"
members = ["crates/lluvia_vk", "crates/lluvia_media", "crates/lluvia_webgpu"]


###########################################################
# Dependencies
[workspace.dependencies]
anyhow = { version = "1.0.102" }
bitflags = { version = "2.11.1" }
bon = { version = "3.9.1" }
bytemuck = { version = "1.25.0" }
bytes = { version = "1.11.1" }
clap = { version = "4.6.1" }
flume = { version = "0.12.0" }
foldhash = { version = "0.1.5" }
mlua = { version = "0.11.6", features = ["luau"] }
pollster = { version = "0.4.0" }
rstest = { version = "0.26.1" }
thiserror = { version = "2.0.18" }
tokio = { version = "1.52.1" }
tokio-macros = { version = "~2.7.0" }
vulkano = { version = "0.35.2" }
vulkano-shaders = { version = "0.35.0" }
wgpu = { version = "29.0.1" }

wasm-bindgen = "0.2.120"
wasm-bindgen-futures = "0.4.70"
wasm-bindgen-test = "0.3.70"
