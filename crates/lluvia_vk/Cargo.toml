[package]
name = "lluvia-vk"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A real-time computer vision engine implemented on top of Vulkan API."
homepage = "https://lluvia.ai"
repository = "https://github.com/jadarve/lluvia-rs"
documentation = "https://docs.rs/lluvia-vk"
readme = "README.md"
keywords = ["vulkan", "gpu", "compute", "image-processing", "computer-vision"]
categories = ["computer-vision", "graphics", "science"]
build = "build.rs"
include = [
    "src/**/*",
    "resources/**/*.luau",
    "resources/**/*.spv",
    "build.rs",
    "Cargo.toml",
    "README.md",
]

[dependencies]
bon = { workspace = true }
base64 = { workspace = true }
bytemuck = { workspace = true }
foldhash = { workspace = true }
glam = { workspace = true }
include_dir = { workspace = true }
mlua = { workspace = true, features = [
    "luau",
    "serde",
    "userdata-wrappers",
    "send",
] }
thiserror = { workspace = true }
vulkano = { workspace = true }
strum = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
image = { workspace = true }
rstest = { workspace = true }
vulkano-shaders = { workspace = true }
